---
name: Staging Deploy
run-name: Publish web tools to staging website

on:
  pull_request:
    branches: [main]

concurrency:
  group: staging-deploy-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PREVIEW_PATH: /${{ github.event.repository.name }}/pr/${{ github.event.number }}
  STAGING_URL: https://staging.overturemaps.org
  AWS_ROLE_ARN: arn:aws:iam::763944545891:role/pages-staging-oidc-overturemaps
  AWS_REGION: us-west-2

jobs:
  check-fork:
    name: Check fork
    runs-on: ubuntu-slim
    steps:
      - name: Staging deploy is not supported for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning title=Staging deploy not supported for fork PRs::Staging previews are only available for PRs from branches within this repository, not forks. Please open your PR from a branch in OvertureMaps/web-tools."

  build:
    name: Build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: check-fork
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - run: npm ci

      - name: Build all tools
        run: npm run build
        env:
          BASE_PATH: ${{ env.PREVIEW_PATH }}/

      - name: Upload build as an artifact 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist
          name: build-artifact

  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    needs: [check-fork, build]
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}${{ env.PREVIEW_PATH }}/index.html
    permissions:
      id-token: write # for AWS OIDC authentication
      pull-requests: write # for posting staging preview PR comments

    steps:
      - name: Configure AWS credentials 🔐
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifact 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact
          path: build

      - name: Copy to S3
        run: |
          aws s3 sync --delete --quiet build s3://overture-managed-staging-usw2/gh-pages${PREVIEW_PATH}/

      - name: Bust the Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E1KP2IN0H2RGGT --paths "${PREVIEW_PATH}/*"

      # Staging does not serve a directory's index.html, so tool links name it.
      - name: Gather metadata for PR comment
        id: deploy-metadata
        run: |
          echo "time=$(date -u +'%b %d, %Y %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "short-sha=${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo "tools<<EOF"
            for dir in build/*/; do
              tool=$(basename "$dir")
              echo "| 🧰 **${tool}** | ${STAGING_URL}${PREVIEW_PATH}/${tool}/index.html |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          message: |
            ## 🗺️ Overture web tools preview is live!

            |                         |                                                                      |
            |-------------------------|----------------------------------------------------------------------|
            | 🌍 **Preview site**     | ${{ env.STAGING_URL }}${{ env.PREVIEW_PATH }}/index.html             |
            ${{ steps.deploy-metadata.outputs.tools }}
            | 🕐 **Updated**          | ${{ steps.deploy-metadata.outputs.time }}                            |
            | 📝 **Commit**           | [${{ steps.deploy-metadata.outputs.short-sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}) |

            > [!NOTE]
            > ♻️ This preview updates automatically with each push to this PR.
