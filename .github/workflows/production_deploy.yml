---
name: Production Deploy
run-name: Build and deploy web tools to GitHub Pages

on:
  push:
    branches: [main]

  # Allow running from the actions tab.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read # required to checkout the code from the repo

jobs:
  build:
    name: Build
    if: github.repository == 'OvertureMaps/web-tools'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Configure sustainable npm
        uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - name: Install NPM dependencies
        run: npm ci

      - name: Test
        run: npm test

      # BASE_PATH defaults to /web-tools/, matching
      # https://labs.overturemaps.org/web-tools/.
      - name: Build all tools 🔧
        run: npm run build

      - name: Setup Pages 🗂️
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site as GH-Pages artifact 📦
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: https://labs.overturemaps.org/web-tools/
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication with GitHub Pages
      pages: write # for actions/deploy-pages

    steps:
      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
