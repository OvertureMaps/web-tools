---
version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      gha-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    labels:
      - 'bot'
    cooldown:
      default-days: 7
    commit-message:
      prefix: '[CHORE](deps)'
      include: 'scope'

  # Maintain npm dependencies for every tool (npm workspaces share one lockfile)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    labels:
      - 'bot'
    cooldown:
      default-days: 7
    commit-message:
      prefix: '[CHORE](deps)'
      include: 'scope'
